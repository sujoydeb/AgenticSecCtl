# Local checks before each commit (WP-1.1). Hooks are local so no third-party hook repository has to be
# trusted or pinned; they call the same scripts as scripts/check_all.sh.
repos:
  - repo: local
    hooks:
      - id: code-checks
        name: import boundaries and secret scan
        entry: python3 -I scripts/check_code.py
        language: system
        pass_filenames: false
      - id: docs-checks
        name: document consistency
        entry: python3 -I scripts/check_docs.py
        language: system
        pass_filenames: false
        files: '\.(md|yaml|yml|html)$'
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
