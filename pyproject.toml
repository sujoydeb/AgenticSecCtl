# Shared tooling configuration for all Python packages (WP-1.1). Not a package: no [project] table.
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["services/common/src", "services/api/src", "services/gateway/src", "services/scanner/src", "services/common/tests", "tests"]
extend-exclude = [
  "tests/fixtures",
  # document tooling written before the baseline; it has its own checks (check_docs.py)
  "scripts/build_catalogue_md.py", "scripts/build_spec_html.py", "scripts/catalogue_lib.py",
  "scripts/check_docs.py", "scripts/sync_versions.py", "scripts/validate_yaml.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4"]
# S101: asserts are fine in tests; production code uses explicit errors (not enforced by ruff, checked in review).
# E501: line length is not enforced. SQL statements, regular-expression tables and evidence strings are kept on one
# line because wrapping them hides what they match; there is no formatter in the project to wrap them consistently.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "S310", "S104", "E701", "E702", "E731", "S311", "S603", "S607", "S602", "B023"]   # dummy secrets, local test servers, dense one-line test steps, seeded randomness, docker CLI calls
"tests/**" = ["S603", "S607", "S602", "S105", "S106", "S108", "S104", "S310", "S311", "E701", "E702", "E731", "B023"]
"scripts/**" = ["S602", "S603", "S607"]   # developer scripts that run commands on purpose

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["services/common/src", "services/api/src", "services/gateway/src", "services/scanner/src"]
explicit_package_bases = true
namespace_packages = true
