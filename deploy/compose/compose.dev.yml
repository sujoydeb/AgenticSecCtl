# Development stack for WP-1.1: PostgreSQL, OPA, Keycloak and the (still empty) fixture network.
# Development only: the passwords below are throwaway values, ports bind to 127.0.0.1, and Keycloak
# runs in start-dev mode. Images are pinned by digest (the PostgreSQL and OPA digests are the ones the
# docs-check workflow uses; the Keycloak digest was read for tag 26.8.2 on 2026-11-22).
# Start: docker compose -f deploy/compose/compose.dev.yml up -d     Stop: ... down -v
name: agenticsecctl-dev

services:
  postgres:
    image: postgres@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_PASSWORD: dev-only-not-a-secret
      POSTGRES_DB: agenticsecctl
    ports: ["127.0.0.1:5432:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenticsecctl"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  opa:
    image: openpolicyagent/opa@sha256:ff50f50332ff9e722ffafe2658c195ced1f9b6d4f3064000c2ecfa8cdf7acccf
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policy"]
    volumes: ["../../policy/rego:/policy:ro"]
    ports: ["127.0.0.1:8181:8181"]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    read_only: true

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    volumes: ["./keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-not-a-secret
    ports: ["127.0.0.1:8080:8080"]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

networks:
  backend: {}
  # Isolated network for the hostile and benign fixture MCP servers (WP-1.12). `internal: true` gives it
  # no route to the outside or to the host; nothing is attached yet.
  fixtures:
    internal: true
