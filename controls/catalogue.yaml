  - id: "CTL-22"
    name: "Multi-tenancy, data residency and retention"
    type: "P"
    enforcement: "deterministic"
    component: "Platform"
    objective: "Keep tenants separate, keep data in permitted regions, and retain or delete it as policy and law require."
    how_it_works:
      - "Every row, cache entry, event and evidence item carries a tenant ID; Postgres row-level security enforces it."
      - "Per-tenant policy bundles; per-tenant encryption keys in Phase 5."
      - "A tenant data plane can be pinned to a region."
      - "Retention classes control deletion by data class; legal hold overrides deletion."
      - "A legal hold stops deletion of held data classes until the compliance role releases it with a recorded reason; retention jobs skip and report held items (FR-ADM-7)."
    prevent:
      - "Cross-tenant access; storage outside the pinned region; premature deletion under hold."
    detect:
      - "Cross-tenant access attempts; retention job failures."
    respond:
      - "Suspend the tenant's access to the implicated component."
    recover:
      - "Restore from backup within the same region and tenant."
    parameters:
      - "Retention: 13 months hot and 7 years cold by default per spec NFR-6."
    failure_behavior: "Tenant context missing: deny."
    false_positives:
      - "Legitimate shared resources blocked by strict tenant checks."
    false_negatives:
      - "Side channels in shared infrastructure."
    bypass_scenarios:
      - "Application bug that forgets a tenant filter (limited by row-level security)."
    residual_risk: "Shared-infrastructure side channels; residency depends on correct deployment (threat I)."
    requirements:
      - "FR-ADM-2"
      - "FR-ADM-4..5"
      - "FR-RT-8"
      - "NFR-6"
      - "NFR-8"
      - "FR-ADM-7"
    threats:
      - "I"
    tests:
      - "TC-I3"
      - "TC-Z19"
    evidence:
