    status: "specified"
    verify: "Agent-to-agent protocol standards and their security models are unverified."
  - id: "CTL-21"
    name: "Model registry and endpoint protection: approved model pinning, substitution detection, quotas"
    type: "P, D"
    enforcement: "deterministic"
