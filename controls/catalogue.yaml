    owner_role: "Compliance liaison"
    phase: "P2/P5"
    status: "specified"
    verify: ""
  - id: "CTL-23"
    name: "Separation of duties, privileged and break-glass access"
    type: "P, D"
    enforcement: "deterministic"
    component: "API, IdP"
    objective: "Ensure no single person can request and approve their own change, and that privileged access is limited and recorded."
    how_it_works:
      - "Roles come from the enterprise IdP with MFA; permissions follow the role matrix."
      - "The API, not the UI, enforces that requester and approver differ for tool approval, JIT grants, high-impact calls and agent registration."
      - "Critical-finding overrides need two approvers and expire."
      - "No role can alter or delete audit events through application interfaces."
      - "Break-glass accounts are sealed in the secrets manager; each use needs a ticket and a second person; sessions are recorded; credentials are rotated after use; the accounts cannot modify audit records or read raw evidence."
    prevent:
      - "Self-approval and single-person overrides; unrecorded privileged access."
    detect:
      - "Rejected self-approvals; break-glass use; approval concentration between two people."
    respond:
      - "Suspend approval rights of involved accounts; revert policy."
    recover:
      - "Re-review decisions; recertify approvers."
    parameters:
      - "Override approvers required: 2."
      - "Access recertification interval: quarterly in the runbook."
    failure_behavior: "IdP unavailable: no new privileged sessions; break-glass path available under its own controls."
    false_positives:
      - "Small teams struggle to find a second approver."
    false_negatives:
      - "Collusion between two approvers."
    bypass_scenarios:
      - "Shared credentials or accounts outside the IdP."
    residual_risk: "Collusion and compromised privileged accounts (threat X6, X8)."
    requirements:
      - "SoD-1"
      - "SoD-2"
      - "SoD-3"
      - "FR-ADM-6"
      - "FR-UI-7"
    threats:
      - "E"
      - "X6"
      - "X8"
    tests:
      - "TC-E4"
      - "TC-X6"
      - "TC-X8"
      - "TC-Z24"
    evidence:
      - "Role bindings and access reviews."
      - "Break-glass usage records and post-use reviews."
    metrics:
      - "Self-approval attempts."
      - "Break-glass uses."
      - "Accounts with privileged roles."
    depends_on:
      - "CTL-13"
    owner_role: "Security admin"
    phase: "P1/P2"
    status: "specified"
    verify: ""
  - id: "CTL-24"
    name: "Resilience: fail-closed behaviour, HA, backup, DR testing"
    type: "P, V"
    enforcement: "deterministic"
    component: "Platform"
    objective: "Keep the platform available without ever trading availability for weaker controls, and recover quickly from loss."
    how_it_works:
      - "Fail-closed rules apply for PDP, registry, policy bundle, revocation lookup and audit capacity."
      - "Gateways run at least 3 replicas across zones; Postgres has a synchronous replica; OPA runs next to each gateway."
      - "Backups with point-in-time recovery and restore tests, including audit chain verification after restore."
      - "Disaster-recovery exercises are timed and fail if the restored audit chain does not verify."
    prevent:
      - "Single failures do not open access."
    detect:
      - "Health, replication lag, bundle age, probe failures."
    respond:
      - "Runbook failover and restore procedures."
    recover:
      - "Region failover and failback."
    parameters:
      - "Availability: 99.95 percent monthly (Phase 5)."
      - "RPO at most 5 min; RTO at most 30 min (Phase 5)."
      - "Gateway replicas: at least 3."
    failure_behavior: "By design: deny when dependencies fail; the cost is business agents stop."
    false_positives:
      - "Fail-closed denies valid calls during outages."
    false_negatives:
      - "Untested recovery paths."
    bypass_scenarios:
      - "Operators loosening fail-closed to restore service (prohibited by the runbook)."
    residual_risk: "Availability impact on business agents; targets are unmeasured proposals."
    requirements:
      - "FR-AUTHZ-8"
      - "FR-AUD-7"
      - "NFR-3..4"
      - "NFR-1..2"
      - "NFR-5"
    threats:
      - "E"
      - "X8"
    tests:
      - "TC-Z5"
      - "TC-Z6"
      - "TC-Z14"
      - "TC-Z15"
      - "TC-Z16"
      - "TC-Z17"
      - "TC-Z18"
    evidence:
      - "HA design and configuration."
      - "Backup, restore and DR exercise reports."
    metrics:
      - "Availability and error budget."
      - "Restore test success."
      - "Time to restore in exercises."
    depends_on:
      - "CTL-13"
    owner_role: "Platform operator"
    phase: "P1/P5"
    status: "specified"
    verify: ""
  - id: "CTL-25"
    name: "Compliance evidence generation and framework mapping governance"
    type: "D"
    enforcement: "hybrid"
    component: "Compliance engine"
    objective: "Produce evidence for controls and keep framework mappings reviewed and honest about what they claim."
    how_it_works:
      - "Controls and mappings are versioned in source control; each mapping is labelled mandatory, guidance or voluntary."
      - "Evidence packs are generated per control and period from audit and registry data, signed and hash-listed."
      - "Legal and compliance review mappings before release and on framework changes; the review date is recorded."
