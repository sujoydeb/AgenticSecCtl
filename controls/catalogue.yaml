# Control catalogue source. Strict YAML subset: see scripts/catalogue_lib.py.
# Generated view: controls/catalogue.md (python3 -I scripts/build_catalogue_md.py controls/catalogue.yaml controls/catalogue.md)
version: "0.4"
status_note: "Draft. Every control is specified; none is implemented. Numeric parameters come from the functional spec; where the spec gives no value the entry says to be set."
depends_on_docs: "Plan/functional-spec.md v0.6, Plan/architecture.md v0.5, Plan/threat-model.md v0.5, docs/testing/cases.md v0.5, docs/runbooks/operational-runbook.md v0.3, compliance/compliance-matrix.md v0.5, docs/governance.md v0.3"
satisfies: "FR-COMP-1 (control catalogue with description, owner, type and component). Framework mappings live in compliance/compliance-matrix.md and are not repeated here."
intro: "A control is a platform capability that reduces a named threat. Each entry says how the control works step by step, what it contributes to prevention, detection, response and recovery, how it fails, where it produces false positives and false negatives, how it can be bypassed, and what risk remains. Owners are roles, not people. Status is specified for every control."
enforcement_classes:
  - "deterministic: the decision is made by fixed rules or checks that give the same result for the same input; this is the only class allowed to enforce a high-impact decision alone."
  - "human: a person decides, with deterministic gates around the decision (who may decide, what exactly is being approved, expiry, audit)."
  - "advisory: produces signals or reports; never the sole control for a high-impact decision."
  - "hybrid: a deterministic part enforces and an advisory or human part adds judgement; the deterministic part alone must keep the system safe."
excluded:
  - "Business-process controls outside the platform (risk classification of AI systems, data protection impact assessments, regulatory reporting decisions, model validation); see compliance/compliance-matrix.md Section 6."
  - "Controls inside MCP servers and agent frameworks that the platform cannot observe; the platform reports these gaps through CTL-26."
  - "Physical and HR controls."
controls:
  - id: "CTL-01"
    name: "Inventory and registration of agents, servers and tools with owner, environment, criticality"
    type: "P, D"
    enforcement: "deterministic"
    component: "Registry/API"
    objective: "Ensure every agent, server and tool that can act is known, owned and classified, and that unknown ones are denied."
    how_it_works:
      - "An owner registers an agent (owner, environment, criticality, model reference) or a server (URL, namespace, transport, owner, expected egress destinations)."
      - "The server URL passes the SSRF guard (CTL-08) before any connection is made."
      - "A person other than the requester approves agent registration (SoD-1, FR-ID-2)."
      - "Servers and tools receive unique IDs; tools are addressed as namespace__tool; identical tool names on different servers raise a duplicate-name finding and are never routed implicitly."
      - "The gateway consults the registry cache; an unregistered agent or server is denied."
    prevent:
      - "Calls from unregistered agents or to unregistered servers are denied."
      - "Ambiguous tool names cannot be routed."
    detect:
      - "Duplicate-name findings at registration; assets without an owner appear in reports."
    respond:
      - "Mark an asset retired or quarantined; revoke its identity (CTL-04)."
    recover:
      - "Re-registration with a new approval after remediation."
    parameters:
      - "Namespace separator: double underscore (architecture and spec FR-INV-2)."
      - "Registry cache TTL at the gateway: at most 60 s."
    failure_behavior: "Registry unreachable and cache expired: deny."
    false_positives:
      - "A legitimate new development server is blocked until registered."
      - "Generic tool names shared by design raise duplicate-name findings."
    false_negatives:
      - "Assets that never pass through the gateway are not seen unless discovery (CTL-26) finds them."
    bypass_scenarios:
      - "Local stdio servers, IDE-embedded agents and direct SaaS connectors that skip the gateway."
      - "Agent frameworks that drop namespaces on the client side."
    residual_risk: "Unmanaged endpoints remain outside enforcement and are reported only (threat X2). Accepted until owners sign off."
    requirements:
      - "FR-INV-1..4"
      - "FR-ID-1..2"
    threats:
      - "C"
      - "F"
      - "X2"
    tests:
      - "TC-C1"
      - "TC-C3"
      - "TC-F1"
      - "TC-Z26"
    evidence:
      - "Inventory export with owners and criticality."
      - "Registration approvals showing requester and approver."
      - "Unregistered-asset and duplicate-name reports."
    metrics:
      - "Assets without an owner (target 0)."
      - "Denials for unregistered agent or server per day."
      - "Share of observed tool calls that go through registered agent-server pairs."
    depends_on:
      - "CTL-08"
      - "CTL-23"
    owner_role: "Security engineer"
    phase: "P1"
    status: "specified"
    verify: ""
  - id: "CTL-02"
    name: "Tool scanning with reproducible scoring; approval with separation of duties and dual-control override"
    type: "P, D"
    enforcement: "hybrid"
    component: "Scanner, Registry"
    objective: "Stop poisoned or unsafe tool definitions from being approved, with evidence and a reproducible score."
    how_it_works:
      - "A hardened importer fetches tools/list from the registered server with timeouts, size and depth caps, no redirects by default, in an unprivileged isolated worker."
      - "Definitions are normalised (Unicode NFC, invisible and bidirectional characters flagged, common encodings decoded for analysis only)."
      - "Deterministic rules produce findings with rule ID, severity, location, evidence excerpt and confidence."
      - "Score = min(100, sum of rule weight x confidence); weights Critical 40, High 20, Medium 8, Low 2; the rule-set version is stored with the scan."
      - "An optional classifier can only raise severity; it never lowers a deterministic finding and never approves."
      - "A reviewer who is not the owner approves; a Critical finding needs two distinct approvers and a justification with expiry."
      - "On a rule-set update approved tools are re-scanned; a Critical finding quarantines the tool and notifies, lower severities create review items."
      - "The scanner protects itself: input size and complexity caps, per-tenant queue quotas, and timeouts that leave a tool not approved, never approved; an evasion regression set runs on every rule-set or model update."
    prevent:
      - "Tools with Critical findings cannot be approved by one person."
    detect:
      - "Hidden or override instructions, credential requests, URLs and IPs, encoded blobs, tool-chaining instructions, schema anomalies."
    respond:
      - "Reject the tool or quarantine it (CTL-03); notify owner and approvers."
    recover:
      - "Owner fixes the definition; a new version is scanned and approved."
    parameters:
      - "Severity weights: Critical 40, High 20, Medium 8, Low 2."
      - "Override: two distinct approvers (SoD-2)."
      - "Importer limits (timeout, size, depth): to be set."
    failure_behavior: "Scanner unavailable: scans queue and nothing new can be approved; live calls on already approved tools are unaffected."
    false_positives:
      - "Legitimate descriptions that contain words like ignore or documentation URLs."
      - "Benign encoded strings in examples."
    false_negatives:
      - "Paraphrased, multilingual or split-across-fields instructions that rules do not match."
      - "A tool that is benign at review and changes later (see CTL-03)."
      - "Evasion between regression updates (homoglyphs, split or nested encodings)."
    bypass_scenarios:
      - "Instruction text phrased to avoid the rule set."
      - "Collusion between two approvers."
    residual_risk: "Novel phrasing evades deterministic rules and the classifier is advisory, so the control reduces but does not remove tool poisoning (threat A). Detector quality budgets are in spec Section 10."
    requirements:
      - "FR-SCAN-1..4"
      - "FR-SCAN-6"
      - "FR-SCAN-9"
      - "SoD-1"
      - "SoD-2"
      - "FR-SCAN-7"
      - "FR-SCAN-10"
    threats:
      - "A"
      - "X1"
      - "X6"
      - "X12"
    tests:
      - "TC-A1..A5"
      - "TC-E4"
      - "TC-Z2"
      - "TC-X12"
      - "TC-Z12"
    evidence:
      - "Scan reports with rule-set version, findings and evidence."
      - "Approval and override records with approver identities."
      - "Precision and recall results on the labelled corpus."
    metrics:
      - "Recall and precision on the benchmark corpus (targets: 95 percent and 90 percent)."
      - "Overrides per month and their age."
      - "Time from registration to decision."
    depends_on:
      - "CTL-08"
      - "CTL-23"
    owner_role: "Security engineer"
    phase: "P1"
    status: "specified"
    verify: "External MCP scanners as advisory signals or corpus sources are unverified (docs/tech-evaluation.md)."
  - id: "CTL-03"
    name: "Definition pinning (canonical hash) and drift quarantine"
    type: "P, D, R"
    enforcement: "deterministic"
    component: "Gateway, Registry"
    objective: "Make sure agents only use the exact tool definition that was approved, and block it the moment it changes."
    how_it_works:
      - "On approval, store the canonical JSON (RFC 8785, Unicode NFC) of server ID, name, description, input schema, output schema and annotations, and its SHA-256; approved versions are immutable (database trigger)."
      - "The gateway recomputes the hash on every tools/list, on list_changed notifications, on a scheduled poll and at call time against a definition cached for at most 60 s."
      - "On mismatch the tool is set to quarantined, removed from lists, calls are denied, a finding is raised and approvers are notified with a field-level diff."
      - "Re-approval creates a new immutable version; history is kept."
    prevent:
      - "Calls to a changed definition are denied before the server is contacted."
    detect:
      - "Hash mismatch events with old and new hash and the changed field."
      - "Response shape and size deviations from a baseline (Phase 4)."
    respond:
      - "Automatic quarantine; notification; diff view for review."
    recover:
      - "Re-scan and approve a new version, or reject."
    parameters:
      - "Definition cache TTL for call-time check: 60 s default."
      - "Quarantine propagation to gateway caches: within 5 s."
    failure_behavior: "Registry unreachable: the gateway keeps denying hash mismatches from its local approved copy; after the cache expires all calls are denied."
    false_positives:
      - "Benign server releases that change descriptions or schemas quarantine many tools at once (quarantine storm)."
    false_negatives:
      - "Behaviour that changes while the definition stays identical, including per-user or time-conditional behaviour."
    bypass_scenarios:
      - "Exploiting the cache window (bounded by the call-time check)."
      - "Malicious behaviour approved from the start."
    residual_risk: "Hashing detects change, not malice; unchanged definitions can still behave badly (threat B, X7). Compensating controls are CTL-09 and behaviour baselines."
    requirements:
      - "FR-DRIFT-1..7"
      - "FR-RT-1"
    threats:
      - "A"
      - "B"
      - "X7"
    tests:
      - "TC-B1..B4"
      - "TC-Z3"
    evidence:
      - "Version history with hashes."
      - "Drift events with diffs and quarantine records."
      - "Race-test results."
    metrics:
      - "Time from change to quarantine."
      - "Calls to quarantined tools that succeeded (target 0)."
      - "Quarantines per week and share resolved as benign."
    depends_on:
      - "CTL-13"
    owner_role: "Security engineer"
    phase: "P1/P2"
    status: "specified"
    verify: ""
  - id: "CTL-04"
    name: "Agent identity and credential lifecycle (unique identity, rotation, revocation, deny on revocation-lookup failure)"
    type: "P, R"
    enforcement: "deterministic"
    component: "Identity/broker"
    objective: "Give every agent its own revocable identity so misuse is attributable and containable."
    how_it_works:
      - "Each agent gets a unique identity and OAuth client; shared credentials are not allowed."
      - "Registration needs an owner and an approver who is not the requester."
      - "Credentials are short-lived and rotated; the revocation list is distributed to gateways."
      - "On a suspected compromise the broker and IdP revoke tokens and clients; gateways deny revoked identities."
      - "If the revocation list or service cannot be consulted, the gateway denies."
    prevent:
      - "Unregistered or revoked identities cannot call tools."
    detect:
      - "New client registrations and credential use from unexpected places are alerted."
    respond:
      - "Immediate revocation and suspension of the agent."
    recover:
      - "New credentials issued under separation of duties."
    parameters:
      - "Access token lifetime: 10 minutes or less by default (FR-AUTHN-2)."
      - "Rotation interval: to be set."
    failure_behavior: "Revocation lookup unavailable: deny (FR-ID-7)."
    false_positives:
      - "Deny after a transient revocation-service failure interrupts valid agents."
    false_negatives:
      - "A compromised but legitimately registered agent is not detected by identity alone."
    bypass_scenarios:
      - "Stolen token used inside its lifetime when sender binding is unavailable."
    residual_risk: "Compromise of a legitimate agent identity remains possible and is limited by least privilege and monitoring (threat F)."
    requirements:
      - "FR-ID-1..3"
      - "FR-ID-7"
    threats:
      - "F"
      - "G"
    tests:
      - "TC-F1"
      - "TC-F2"
      - "TC-G1"
    evidence:
      - "Client registry with owners."
      - "Rotation and revocation logs."
    metrics:
      - "Time to revoke after decision."
      - "Credentials older than the rotation interval."
    depends_on:
      - "CTL-23"
    owner_role: "Security engineer"
    phase: "P1/P2"
    status: "specified"
    verify: "Support for DPoP, mTLS binding and token exchange depends on the chosen IdP and is unverified."
  - id: "CTL-05"
    name: "Authentication hardening: audience/scope validation, sender-constrained tokens, no token passthrough, session binding, server identity validation, secret redaction"
    type: "P, D"
    enforcement: "deterministic"
    component: "Gateway, broker"
    objective: "Stop stolen, replayed or mis-targeted credentials and confused-deputy use from working."
    how_it_works:
      - "On every request the gateway validates signature, issuer, expiry, audience (its own resource identifier) and scope."
      - "Where the IdP supports it, tokens are bound to the sender (DPoP or mTLS) and replay from another client fails."
      - "The gateway never forwards client tokens to servers; it obtains audience-bound upstream credentials by token exchange or from the secrets broker."
      - "Session IDs are unguessable, expire and are bound to the authenticated client; reuse by another client is rejected."
      - "The server certificate or JWKS is checked against the pin in the registry before data is sent."
      - "Logs, traces, errors and the UI redact tokens and secrets."
      - "Client registration is closed by default: dynamic client registration and client-metadata-document registration are enabled only per tenant with approval, allowlisted redirect URIs or metadata hosts, rate limits and an owner; new clients start unapproved."
    prevent:
      - "Tokens for another audience, expired or forged tokens, and session reuse by a different client."
    detect:
      - "Authentication failures by category, sender mismatch and session-client mismatch alerts."
    respond:
      - "Revoke client, suspend session (CTL-04, CTL-12)."
    recover:
      - "Rotate credentials; re-establish sessions."
    parameters:
      - "Access token lifetime: 10 minutes or less by default."
    failure_behavior: "IdP key set unreachable: cached keys are used until they expire, then all calls are denied."
    false_positives:
      - "Valid clients rejected after clock skew or key rotation."
    false_negatives:
      - "Fallback mode without sender binding allows replay until revocation or expiry."
    bypass_scenarios:
      - "Long-lived tokens configured by owners."
      - "Secrets that reach logs through formats the redactor does not recognise."
    residual_risk: "In fallback mode a stolen token is usable inside its lifetime (threat G); the test record states the mode used."
    requirements:
      - "FR-AUTHN-1..6"
      - "FR-AUTHN-7"
    threats:
      - "C"
      - "F"
      - "G"
      - "X13"
    tests:
      - "TC-C2"
      - "TC-F2"
      - "TC-G1..G5"
      - "TC-X13"
    evidence:
      - "Token validation configuration."
      - "Authentication failure logs without secret values."
      - "Redaction test results and the sender-binding mode in use."
    metrics:
      - "Authentication failures by category."
      - "Share of tokens sender-constrained."
      - "Secret-in-log findings (target 0)."
    depends_on:
      - "CTL-04"
    owner_role: "Security engineer"
    phase: "P1/P2"
    status: "specified"
    verify: "MCP authorization requirements, DPoP/mTLS support and token exchange: search-verified background is in the verification log of docs/tech-evaluation.md (MCP revision 2026-07-28; Keycloak DPoP from 26.4; token exchange V2 internal-to-internal only); section-level details and the production IdP remain unverified."
  - id: "CTL-06"
    name: "Least-privilege authorization, deny by default, action classes, agent→server allowlists, unused-permission and escalation reporting"
    type: "P, D"
    enforcement: "deterministic"
    component: "PDP, Gateway"
    objective: "Limit each agent to the specific tools, action classes and resources it needs, and notice when that drifts."
    how_it_works:
      - "The gateway sends the PDP agent, tool, action class (read, write, execute, delete), resource, an arguments digest and context such as taint and grants."
      - "OPA evaluates signed policy and registry data and returns allow or deny plus obligations; the default is deny."
      - "Tool annotations are never used as inputs; the action class comes from the registry, set at approval."
      - "An agent-to-server allowlist is enforced."
      - "Reports list permissions unused for 30 days, permissions broader than observed use, and changes made outside an approved change."
    prevent:
      - "Calls outside granted tool, action class or resource are denied."
    detect:
      - "Unused and excessive permissions; unapproved permission changes."
    respond:
      - "Remove the grant or allow rule; suspend the agent if abused."
    recover:
      - "Re-grant under review with a TTL where appropriate."
    parameters:
      - "Unused-permission window: 30 days default."
      - "Decision cache TTL: short, keyed on policy hash and input digest; value to be set."
    failure_behavior: "PDP or policy bundle unavailable or stale: deny. A tenant may allowlist specific read-only low-risk tools for fail-open, always flagged in the audit log."
    false_positives:
      - "Legitimate rare tasks denied because the grant was too narrow."
    false_negatives:
      - "A wrong action-class mapping, such as a read tool that actually writes, lets a call through."
    bypass_scenarios:
      - "Wildcard resource patterns written by owners."
      - "Argument-level abuse inside a permitted tool."
    residual_risk: "Quality of the tool-to-action-class mapping depends on approvers (threat E); periodic recertification is required."
    requirements:
      - "FR-AUTHZ-1..3"
      - "FR-AUTHZ-6..8"
    threats:
      - "C"
      - "E"
    tests:
      - "TC-E1"
      - "TC-E2"
      - "TC-C3"
      - "TC-Z5"
    evidence:
      - "Policy bundles with hashes."
      - "Decision logs with policy hash and input digest."
      - "Permission review records."
    metrics:
      - "Deny rate by reason."
      - "Permissions unused over 30 days."
      - "Fail-open decisions (target near 0)."
    depends_on:
      - "CTL-13"
      - "CTL-16"
    owner_role: "Security engineer"
    phase: "P1/P2/P3"
    status: "specified"
    verify: "OPA performance with realistic policy data is unmeasured (spike S3)."
  - id: "CTL-07"
    name: "Just-in-time access and human approval for high-impact actions bound to argument hash"
    type: "P"
    enforcement: "human"
    component: "PDP, API"
    objective: "Make sure risky actions happen only with a specific, current human decision."
    how_it_works:
      - "A requester asks for access with tool, action, resource, TTL and reason; an approver who is not the requester approves; the grant expires automatically."
      - "Policy marks high-impact actions: any delete; write or execute on resources tagged critical; sending confidential data outside; financial transactions; actions after untrusted content followed a sensitive read."
      - "For a high-impact call the PDP returns an approval obligation; the gateway holds the call and creates a task showing the exact arguments."
      - "Approval is bound to the hash of those arguments; a changed argument needs a new approval; timeout means deny."
      - "The approval view shows the platform-rendered arguments with their hash, the requester, classification and taint state; agent-supplied text is shown only in a labelled untrusted area; step-up authentication is required; bulk approval is unavailable and rapid approvals raise alerts (FR-AUTHZ-9..11)."
      - "Tenants may add high-impact classes and critical resource tags only through audited changes by the security admin role with a different approver, in shadow mode first; built-in classes cannot be removed (FR-AUTHZ-12)."
    prevent:
      - "High-impact actions without a matching approval are denied."
    detect:
      - "Approval request volume and approval of unusual requests."
    respond:
      - "Revoke the grant; suspend the agent."
    recover:
      - "Reverse the action through the owning system."
    parameters:
      - "JIT TTL: mandatory, value per request."
      - "Approval timeout: to be set."
    failure_behavior: "Approval service unavailable or timeout: deny."
    false_positives:
      - "Approvals required for actions the business considers routine."
    false_negatives:
      - "Harmful actions not classified as high-impact are not gated."
      - "An attentive approver deceived by a plausible but harmful request."
    bypass_scenarios:
      - "Approver fatigue and rubber-stamping."
      - "Many small actions under a threshold."
      - "Collusion between the admin and the approver to weaken classes or tags."
    residual_risk: "Depends on the quality of the high-impact definition and approver attention (threats D, K, E)."
    requirements:
      - "FR-AUTHZ-4..5"
      - "FR-AUTO-3"
      - "FR-AUTHZ-9..11"
      - "FR-AUTHZ-12"
    threats:
      - "D"
      - "E"
      - "K"
      - "X14"
    tests:
      - "TC-E3"
      - "TC-D4"
      - "TC-K3"
      - "TC-X14"
      - "TC-Z33"
      - "TC-Z34"
    evidence:
      - "Grant and approval records with approver and arguments hash."
      - "Timeout and denial records."
    metrics:
      - "Approval latency."
      - "Approval rate and share approved in under 10 seconds (rubber-stamp indicator)."
      - "Expired grants."
    depends_on:
      - "CTL-06"
      - "CTL-13"
      - "CTL-23"
    owner_role: "Approver"
    phase: "P2"
    status: "specified"
    verify: ""
  - id: "CTL-08"
    name: "SSRF protection and egress allowlisting"
    type: "P, D"
    enforcement: "deterministic"
    component: "Egress proxy, Scanner"
    objective: "Stop the platform and MCP servers from being used to reach metadata services, internal systems or arbitrary hosts."
    how_it_works:
      - "Every outbound connection by the platform (registration, import, discovery, health check, proxying) goes through the guard."
      - "The guard normalises the host (decimal, octal, hex, IPv6 forms, userinfo tricks), resolves DNS and validates every returned address against the blocklist: loopback, link-local including 169.254.169.254, RFC 1918, unique-local, multicast, unspecified, IPv4-mapped IPv6, metadata hostnames."
      - "It connects to the validated IP (resolve then pin); redirects are off by default and, if enabled, each hop is re-validated, at most 3."
      - "Server pods can reach only the destinations in their registry allowlist, enforced by network policy or egress proxy outside the gateway process."
      - "Exceptions are explicit per-server entries with owner approval and expiry."
    prevent:
      - "Connections to blocked ranges and unlisted destinations."
    detect:
      - "Blocked-connection events; bursts of probing."
    respond:
      - "Quarantine the registering server; isolate a pod that reached internal addresses; rotate credentials that could have been exposed."
    recover:
      - "Remove the exception, fix the allowlist, re-approve the server."
    parameters:
      - "Maximum redirect hops when enabled: 3."
      - "Exception expiry: to be set."
    failure_behavior: "Guard cannot resolve or validate: connection refused."
    false_positives:
      - "Legitimate internal servers blocked until an exception is approved."
    false_negatives:
      - "Server-side SSRF inside third-party server code is limited only by network egress policy."
    bypass_scenarios:
      - "Parser differences between the guard and the HTTP client library."
      - "Over-broad allowlist exceptions."
    residual_risk: "Misconfigured exceptions and server-internal request forgery remain (threat H); cloud metadata hardening per cloud is needed."
    requirements:
      - "FR-SSRF-1..5"
      - "FR-RT-7"
    threats:
      - "H"
      - "I"
    tests:
      - "TC-H1..H4"
      - "TC-I4"
      - "TC-X2"
    evidence:
      - "Guard configuration and blocklist."
      - "Blocked-connection logs."
      - "Network policy exports and exception approvals."
    metrics:
      - "Blocked connections per day."
      - "Active exceptions and their age."
      - "Direct connections that bypassed the gateway (target 0)."
    depends_on:
      - "CTL-13"
    owner_role: "Security engineer"
    phase: "P1/P2"
    status: "specified"
    verify: "Cloud-specific metadata hardening (IMDSv2 enforcement, pod-level blocking) is unverified per cloud."
  - id: "CTL-09"
    name: "Response inspection for injection, untrusted labelling, taint rule"
    type: "P, D"
    enforcement: "hybrid"
    component: "Gateway, Inspection"
    objective: "Prevent instructions hidden in tool responses or retrieved content from causing unapproved actions or data egress."
    how_it_works:
      - "All tool output is labelled untrusted and delivered in a structure separate from system and developer instructions; a response can never change system-level instructions."
      - "Tier 1 deterministic parsing of text, HTML, JSON and markdown looks for hidden elements, comments, markdown image or link exfiltration patterns, and instructions to run other tools."
      - "Tier 2 and 3 classifiers add advisory signals with confidence."
      - "Policy maps signals to an action: allow with label, redact, block, or quarantine the tool."
      - "Taint rule: after an untrusted read of sensitive data, write, execute and external-send tools are blocked in that session until approved."
      - "Non-text content (images, documents, audio) is labelled untrusted, limited by type and size, extracted for inspection and delivered only if policy allows; content that cannot be inspected is blocked for sessions holding sensitive data. Server error payloads are inspected like any response, and platform errors use fixed catalogue text."
    prevent:
      - "Tainted sessions cannot send data out or act without approval."
      - "Neutralised markup removes common exfiltration channels."
    detect:
      - "Injection signals with element locations."
    respond:
      - "Block the response, suspend the session, quarantine the carrier tool."
    recover:
      - "Remove or sanitise the content at source; resume the agent."
    parameters:
      - "Tier 1 inline budget: under 5 ms for typical payloads."
      - "Inline classifier: p95 at most 150 ms or run asynchronously (NFR-2)."
      - "False-block rate in shadow mode: at most 0.5 percent of benign calls (spec Section 10)."
    failure_behavior: "Tier 1 failure on a high-impact path: deny. Advisory tiers unavailable: continue with Tier 1 and taint rules."
    false_positives:
