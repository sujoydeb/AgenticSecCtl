  - id: "CTL-26"
    name: "Discovery and coverage reporting (known gaps)"
    type: "D"
    enforcement: "advisory"
    component: "Discovery"
    objective: "Find agents and servers outside the gateway and report coverage gaps honestly."
    how_it_works:
      - "Collectors read the Kubernetes API, MCP client configuration files, egress logs and cloud inventories."
      - "Findings enter the registry as unregistered assets for triage."
      - "The dashboard lists coverage gaps such as unmanaged endpoints and direct connectors."
    prevent:
