    type: "P"
    enforcement: "deterministic"
    component: "Gateway, PDP"
    objective: "Prevent one agent from gaining power or spreading instructions through delegation."
    how_it_works:
      - "Agent-to-agent calls go through the gateway and are authenticated and authorized."
      - "Each call carries the delegation chain."
      - "The effective permission of a sub-agent is the intersection with the delegator's permission for that request."
      - "The gateway blocks cycles and chains deeper than the limit."
      - "Agent cards and discovery documents are untrusted input: advertised capabilities, endpoints and keys are verified against registry identity and pins before use, and unverified cards are not routed (FR-ID-8)."
