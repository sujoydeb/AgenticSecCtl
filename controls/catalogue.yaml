  - id: "CTL-13"
    name: "Tamper-evident audit: hash chain, external anchoring, reproducible decisions, deny-high-impact when audit cannot record"
    type: "D"
    enforcement: "deterministic"
    component: "Audit service"
    objective: "Make every decision and administrative action recorded, ordered, reproducible and hard to alter without detection."
    how_it_works:
      - "Each service writes events through an outbox: actor, subject, decision, policy hash, input digest, timestamp."
      - "The audit service chains them: hash_n = SHA-256(hash_n-1 || canonical event n); application database roles are insert-only."
      - "Chain heads are anchored on a schedule in object-lock storage or an external timestamping service."
      - "A verifier recomputes the chain and compares with anchors; modification, deletion or reordering is reported."
      - "Raw payloads are not stored in the table; digests and redacted excerpts only; control characters in untrusted fields are escaped before export."
      - "When the gateway buffer is full or the sink is down beyond capacity, high-impact calls are denied."
    prevent:
      - "Insert-only roles block ordinary tampering; deny-high-impact stops actions that cannot be recorded."
    detect:
      - "Verification failures, sequence gaps, anchor mismatches."
    respond:
      - "Audit integrity incident; freeze changes; preserve snapshots."
    recover:
      - "Restore from the last verified backup and document the gap; never repair the chain."
    parameters:
      - "Anchor interval: to be set."
      - "Retention: 13 months hot and 7 years cold by default, configurable per tenant."
      - "Buffer capacity: to be set."
    failure_behavior: "Audit sink down: buffer locally; when full deny high-impact calls and keep buffering low-impact events until capacity is reached; events are never silently dropped."
    false_positives:
      - "Verification failure caused by operator restore mistakes."
    false_negatives:
      - "Rewrite of the whole chain before the first anchor."
    bypass_scenarios:
      - "Privileged database actor rewriting history between anchors."
    residual_risk: "The chain is tamper-evident, not tamper-proof; anchoring narrows but does not close the window (threat X6, X8)."
