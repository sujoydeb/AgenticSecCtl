  - id: "CTL-27"
    name: "Secure development and change management for the platform"
    type: "P"
    enforcement: "hybrid"
    component: "CI/CD, process"
    objective: "Stop the platform itself from becoming the weakest point."
    how_it_works:
      - "CI runs static analysis, secret scanning, dependency and image scanning, SBOM generation and signing; failures block release."
      - "Changes are classified as standard, security-relevant or emergency with matching approvals; security-relevant changes roll out via shadow mode and canary."
      - "Data plane and control plane use separate deployments and credentials; the gateway holds no long-lived upstream secrets."
      - "A dedicated penetration test covers the gateway and control plane."
      - "Platform configuration is declarative, validated at load, versioned and audited; invalid configuration is refused (FR-ADM-1)."
    prevent:
      - "Vulnerable or unsigned artifacts and unreviewed changes reach production."
    detect:
      - "Gate failures; runtime anomalies on platform pods."
    respond:
      - "Rollback; isolate and redeploy from signed images."
    recover:
      - "Rebuild from clean sources; rotate reachable secrets."
    parameters:
      - "Patch deadlines for critical vulnerabilities: to be set."
    failure_behavior: "Any failed gate blocks the release."
    false_positives:
      - "Gate failures on unreachable vulnerable code."
    false_negatives:
      - "Unknown vulnerabilities; logic flaws not found by tools."
    bypass_scenarios:
      - "Emergency changes that skip review (reviewed afterwards)."
    residual_risk: "Compromise of the gateway or control plane remains possible (threat X8); impact is limited by short-lived credentials and plane separation."
    requirements:
      - "NFR-9"
      - "FR-ADM-1"
    threats:
      - "X8"
      - "L"
    tests:
      - "TC-L3"
      - "TC-X8"
      - "TC-Z10"
    evidence:
      - "CI gate results and SBOMs."
      - "Change approvals and penetration test reports."
    metrics:
      - "Emergency changes per quarter."
      - "Time to patch critical vulnerabilities."
    depends_on: []
    owner_role: "Delivery lead"
    phase: "P1 onward"
    status: "specified"
    verify: ""
  - id: "CTL-28"
    name: "Fleet dashboard, approval workflow and notifications"
    type: "P, D, R"
    enforcement: "human"
    component: "Dashboard, API"
    objective: "Give people an accurate view of the fleet and a safe workflow for approvals, drift review and incidents, with notifications that do not block containment."
    how_it_works:
      - "The dashboard reads counts and relationships from the registry and audit data: agents, servers, tools, approved and unapproved, quarantined, findings, drift events, authentication failures, blocked operations, leakage attempts and incidents."
      - "Drill-down opens agent, server and tool pages with owner, environment, criticality, version history, scan evidence and permissions; a relationship graph links agent, model, server, tool, data source and enterprise system."
      - "The approval queue shows the diff and evidence for each request; the API enforces that the requester cannot approve, whatever the UI shows."
      - "Excessive-permission and compliance posture views are generated from the same data, with evidence-support wording and mandatory, guidance and voluntary items shown separately."
      - "Notifications go to per-tenant channels (email, webhook); delivery failures are retried and reported, and never delay containment actions."
    prevent:
      - "Self-approval and approval without seeing the diff and evidence."
    detect:
      - "Operational views surface denials, blocked operations and leakage attempts; stale counters are visible by age."
    respond:
      - "Reviewers quarantine, reject or approve from the queue; incident links open the incident workflow (CTL-15)."
    recover:
      - "Re-approval of a corrected version from the same queue."
    parameters:
      - "Approval timeout: to be set."
      - "Maximum counter staleness shown in the UI: to be set."
      - "Notification retry policy: to be set."
    failure_behavior: "Dashboard or notification failure does not change enforcement; the API and break-glass path remain available for containment."
    false_positives:
      - "Counters that lag the audit data suggest a problem that does not exist."
    false_negatives:
      - "Alerts or approvals that never reach a human because a notification channel failed silently (mitigated by failure reporting)."
    bypass_scenarios:
      - "Approver fatigue and rubber-stamping."
      - "Misleading approval summaries."
    residual_risk: "Human approval quality depends on what the approver sees and on attention; approval content and step-up authentication need explicit design (gap H4 in docs/reviewgap.md)."
    requirements:
      - "FR-UI-1..6"
      - "FR-ADM-3"
      - "NFR-10"
      - "FR-AUTHZ-9"
    threats:
      - "E"
      - "X6"
      - "X2"
      - "X14"
    tests:
      - "TC-Z7"
      - "TC-Z8"
      - "TC-Z9"
      - "TC-Z11"
      - "TC-Z21"
      - "TC-Z33"
    evidence:
      - "Dashboard test results against seeded data."
      - "Approval records with approver identity and displayed diff reference."
      - "Notification delivery and failure logs."
    metrics:
      - "Median time from drift or request to decision."
      - "Notification failures per week."
      - "Approvals completed in under 10 seconds (rubber-stamp indicator)."
    depends_on:
      - "CTL-13"
      - "CTL-23"
      - "CTL-26"
    owner_role: "Security engineer"
    phase: "P1/P2/P3"
    status: "specified"
    verify: ""
  - id: "CTL-29"
    name: "Data classification and labelling"
    type: "P, D"
    enforcement: "hybrid"
    component: "Registry, Gateway, DLP"
    objective: "Make sensitivity explicit so that DLP, the taint rule and the high-impact definition act on the same labels."
    how_it_works:
      - "Ordered classification levels are defined per tenant (default Public, Internal, Confidential, Restricted), each with a written meaning."
      - "Owners assign a label to every tool, resource and data source in the registry and the approver confirms it; unlabelled items are treated as Confidential."
      - "At run time the gateway gives each tool output and session the highest label of the data it contains or comes from."
      - "Sensitive (Confidential or above) sessions trigger the taint rule, stricter DLP policy and the high-impact definition for external sends."
      - "Every label and every change is audited; lowering a label needs an approver other than the requester."
    prevent:
      - "Unlabelled or mislabelled data does not silently become less restricted; downgrades need a second person."
    detect:
      - "Label changes and taint transitions in the audit log; items without owner labels in reports."
    respond:
      - "Relabel upward and re-run affected reviews when a leak shows a label was too low."
    recover:
      - "Recompute labels for affected sessions and outputs."
    parameters:
      - "Default levels: Public, Internal, Confidential, Restricted (proposed, pending approval)."
      - "Default for unlabelled items: Confidential."
    failure_behavior: "Missing or unreadable label: treat as Confidential."
    false_positives:
      - "Over-labelled data blocks legitimate sends and raises approval volume."
    false_negatives:
      - "Data labelled too low at the source; derived content that inherits no label."
    bypass_scenarios:
      - "Owners labelling everything Public to avoid friction; data copied through tools that do not carry labels."
    residual_risk: "Label quality depends on owners and reviews (threat I); DLP content detection remains the backstop."
    requirements:
      - "FR-DATA-1..4"
    threats:
      - "I"
      - "D"
    tests:
      - "TC-Z25"
      - "TC-I1"
      - "TC-D5"
    evidence:
      - "Classification model document and per-tenant configuration."
      - "Label assignment and change records."
      - "Test results for inheritance and downgrade rules."
    metrics:
      - "Share of registry items with an owner-assigned label."
      - "Downgrades per month and who approved them."
      - "Sends blocked or approved because of labels."
    depends_on:
      - "CTL-06"
      - "CTL-07"
      - "CTL-10"
      - "CTL-13"
    owner_role: "Compliance liaison"
    phase: "P1/P2"
    status: "specified"
    verify: "The level names and the Confidential default are proposals pending approval."
  - id: "CTL-30"
    name: "Platform key management"
    type: "P, D, R"
    enforcement: "hybrid"
    component: "Secrets manager, KMS, CI/CD, broker"
    objective: "Keep the keys that anchor trust (policy signing, image signing, audit anchors, tenant and database encryption, break-glass) inventoried, protected, rotated and recoverable after compromise."
    how_it_works:
      - "A key inventory lists every platform key with class, owner role, location, purpose, rotation interval and last rotation, and is reviewed at least quarterly."
      - "Keys live in a KMS, HSM or secrets manager, non-exportable where supported; secret scanning of repositories, images and logs checks that no key material leaks."
      - "Rotation runs on schedule and on suspected compromise; verification keys reach every gateway before the new signing key is used, with an overlap period."
      - "Use is separated by duty: only the release job can sign policy bundles and images, the audit identity can only write anchors, break-glass secrets stay sealed, and nobody holds both signing and approval roles for the same release."
      - "A written compromise procedure per key class covers revocation, re-signing and re-approval and is exercised at least yearly."
    prevent:
      - "Unauthorised signing; key material outside managed stores."
    detect:
      - "Inventory drift, key-use anomalies, secret-scan findings, failed bundle verification on gateways."
    respond:
      - "Revoke and rotate the affected key; re-sign bundles; open an incident (playbooks PB-05, PB-11)."
    recover:
      - "Re-approve tools or policies signed under a compromised key; verify the audit chain and anchors."
    parameters:
      - "Inventory review: quarterly."
      - "Compromise exercise: at least annually."
      - "Rotation interval per key class: to be set."
      - "Overlap period: to be set."
    failure_behavior: "A bundle or image signed by an unknown or revoked key is rejected; if no valid verification key is available the gateway denies."
    false_positives:
      - "Rotation overlap rejects a bundle signed just before the verification key reached a gateway."
    false_negatives:
      - "Compromise inside the rotation interval; keys outside the inventory."
    bypass_scenarios:
      - "A person with both signing and approval authority; backups containing key material."
    residual_risk: "A compromised key is usable until detection and revocation (threat X8); per-tenant and customer-managed keys come in Phase 5."
    requirements:
      - "FR-KEY-1..6"
      - "FR-ADM-2"
    threats:
      - "X8"
      - "G"
      - "X6"
    tests:
      - "TC-Z31"
      - "TC-Z32"
      - "TC-X8"
    evidence:
      - "Key inventory with review dates."
      - "Rotation and compromise-exercise records."
      - "Secret-scan results and signing-identity configuration."
    metrics:
      - "Keys past rotation interval."
      - "Keys missing from the inventory (target 0)."
      - "Time to rotate after a compromise exercise."
    depends_on:
      - "CTL-13"
      - "CTL-16"
      - "CTL-23"
      - "CTL-27"
    owner_role: "Security engineer"
    phase: "P2/P5"
    status: "specified"
    verify: "KMS, HSM and secrets-manager features differ per cloud; see docs/cloud-adapter-verification.md for the verified AWS adapter."
